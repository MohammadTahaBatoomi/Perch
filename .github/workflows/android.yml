name: Android APK + AAB

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Perch server URL loaded in the WebView"
        required: false
        default: "http://10.0.2.2:3000"
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "public/**"
      - ".github/workflows/android.yml"
      - "package.json"
  pull_request:
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PERCH_SERVER_URL: ${{ inputs.server_url || vars.PERCH_SERVER_URL || 'http://10.0.2.2:3000' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # ubuntu-latest ships Android SDK; sdkmanager is not on PATH by default.
      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "sdk.dir=$SDK" > android/local.properties
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || \
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" || \
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Capacitor sync
        run: |
          echo "PERCH_SERVER_URL=$PERCH_SERVER_URL"
          npx cap sync android

      - name: Create CI keystore
        working-directory: android
        run: |
          keytool -genkeypair -v \
            -keystore perch-ci.jks \
            -alias perch \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass perchci -keypass perchci \
            -dname "CN=Perch CI, OU=Mobile, O=Perch, L=Local, S=NA, C=US"

      - name: Build release APK + AAB
        working-directory: android
        env:
          PERCH_STORE_FILE: perch-ci.jks
          PERCH_STORE_PASSWORD: perchci
          PERCH_KEY_ALIAS: perch
          PERCH_KEY_PASSWORD: perchci
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            assembleRelease bundleRelease \
            -x lint -x test

      - name: Collect artifacts
        run: |
          mkdir -p dist-android
          cp android/app/build/outputs/apk/release/*.apk dist-android/
          cp android/app/build/outputs/bundle/release/*.aab dist-android/
          ls -lah dist-android

      - name: Upload APK + AAB
        uses: actions/upload-artifact@v4
        with:
          name: perch-android
          path: dist-android/
          if-no-files-found: error
          retention-days: 14
