<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="Perch">
  <defs>
    <radialGradient id="glow" cx="256" cy="368" r="148" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bird" x1="160" y1="140" x2="370" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.45" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="ledge" x1="150" y1="0" x2="362" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ecfeff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#050508"/>
  <ellipse cx="256" cy="372" rx="128" ry="64" fill="url(#glow)"/>

  <!-- Sleek geometric bird — angular tech mark, not cartoon -->
  <g fill="url(#bird)">
    <!-- Body diamond / wing plane -->
    <path d="
      M196 250
      L252 198
      L338 220
      L318 286
      L236 286
      Z
    "/>
    <!-- Head -->
    <circle cx="348" cy="188" r="36"/>
    <!-- Beak -->
    <path d="M380 180 L418 190 L380 204 Z"/>
    <!-- Tail fork -->
    <path d="M196 250 L148 214 L164 250 L148 286 Z"/>
  </g>

  <!-- Legs -->
  <path d="M252 286 L244 330" stroke="#22d3ee" stroke-width="10" stroke-linecap="round"/>
  <path d="M292 286 L302 330" stroke="#22d3ee" stroke-width="10" stroke-linecap="round"/>

  <!-- Eye -->
  <circle cx="358" cy="180" r="7" fill="#050508"/>

  <!-- Desk perch -->
  <rect x="150" y="334" width="212" height="16" rx="8" fill="url(#ledge)"/>
</svg>
